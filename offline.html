<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Gemini</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #1f1f1f;
        }
        .container {
            text-align: center;
            padding: 32px;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            max-width: 400px;
        }
        h1 {
            font-size: 1.8em;
            color: #1a73e8;
            margin-top: 0;
        }
        p {
            margin: 16px 0 24px;
            color: #5f6368;
            line-height: 1.5;
        }
        .retry-btn {
            display: inline-block;
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: #1a73e8;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }
        .retry-btn:hover {
            background: #174ea6;
            transform: translateY(-1px);
        }
        .retry-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're Offline</h1>
        <p>It looks like you're not connected to the internet. Please check your network connection and try again.</p>
        <button id="retry-btn" class="retry-btn">Retry</button>
    </div>
</body>
</html>
