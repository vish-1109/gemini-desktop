name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_packages:
        description: 'Build .deb and AppImage artifacts'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Static Check, Unit Tests & Electron Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux desktop runtime & validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            xvfb \
            libnss3 \
            libgtk-3-0 \
            libnotify4 \
            libxtst6 \
            libgbm1 \
            libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install npm dependencies
        run: npm ci

      - name: Configure Electron SUID sandbox for CI
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run static checks and AppStream validation
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run Electron integration smoke tests
        env:
          CI: 'true'
          ELECTRON_ENABLE_LOGGING: '1'
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run test:integration

  package:
    name: Build Linux .deb and AppImage
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_packages)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build .deb and AppImage packages
        run: npm run build

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.deb *.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .deb or .AppImage artifacts found in dist/"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-desktop-linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
