<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>You're offline - Gemini</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      background: radial-gradient(1200px 600px at 50% -10%, #e8f0fe 0%, #ffffff 60%);
      color: var(--text-primary);
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: radial-gradient(1200px 600px at 50% -10%, #1a2233 0%, #0b0f19 60%);
      }
    }
    .spark {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      opacity: 0.9;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-secondary);
      max-width: 360px;
      margin: 0 0 24px;
    }
    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--md-on-primary);
      background: var(--md-primary);
      border: none;
      border-radius: var(--radius-full);
      padding: 10px 26px;
      cursor: pointer;
      transition: background 150ms ease;
    }
    button:hover {
      background: var(--md-primary-hover);
    }
  </style>
</head>
<body>
  <img class="spark" src="assets/icon.png" alt="Gemini">
  <h1>You're offline</h1>
  <p>Gemini couldn't connect right now. Check your internet connection and try again.</p>
  <button id="btn-retry" type="button">Retry</button>
  <script src="offline.js"></script>
</body>
</html>
