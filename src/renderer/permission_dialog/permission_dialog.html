<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Permission Request</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
      user-select: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    .dialog-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-3);
      width: 100%;
      max-width: 460px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideDown 170ms cubic-bezier(0.05, 0.7, 0.1, 1);
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--icon-bg);
      color: var(--md-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .title {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .subnote {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-weight: 500;
      color: var(--md-primary);
      text-decoration: underline;
      cursor: pointer;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }
    .btn {
      border: none;
      border-radius: var(--radius-full);
      padding: 8px 18px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-block {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-block:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }
    .btn-allow {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-allow:hover {
      background: var(--md-primary-hover);
    }
  </style>
</head>
<body>
  <div class="dialog-card">
    <div class="header">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" id="icon-svg" aria-hidden="true">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <div class="title" id="perm-title">Gemini is requesting permission</div>
    </div>
    <div class="desc" id="perm-desc"></div>
    <div class="subnote">
      You can change this anytime in
      <button type="button" class="link-btn" id="btn-open-settings">Settings</button>.
    </div>
    <div class="actions">
      <button type="button" class="btn btn-block" id="btn-block">Don't Allow</button>
      <button type="button" class="btn btn-allow" id="btn-allow">Allow</button>
    </div>
  </div>
  <script src="permission_dialog.js"></script>
</body>
</html>
