<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Find in page</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8px 12px;
    }
    .bar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-2);
      overflow: hidden;
    }
    .input-area {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      padding: 0 10px 0 12px;
      gap: 6px;
    }
    #input {
      flex: 1;
      min-width: 0;
      height: 28px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13.5px;
    }
    #input::placeholder {
      color: var(--text-tertiary);
    }
    #count {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sep {
      width: 1px;
      height: 20px;
      background: var(--divider-color);
      flex-shrink: 0;
    }
    .buttons {
      display: flex;
      align-items: center;
      padding: 0 4px;
      gap: 2px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
    }
    .btn:hover:not(:disabled) {
      background: var(--hover-bg);
      color: var(--text-primary);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="input-area">
      <input id="input" type="text" placeholder="Find in page" spellcheck="false" autocomplete="off" aria-label="Find in page">
      <span id="count"></span>
    </div>
    <div class="sep"></div>
    <div class="buttons">
      <button id="prev" class="btn" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <button id="next" class="btn" type="button" title="Next match (Enter)" aria-label="Next match" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <button id="close" class="btn" type="button" title="Close (Escape)" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="find_bar.js"></script>
</body>
</html>
