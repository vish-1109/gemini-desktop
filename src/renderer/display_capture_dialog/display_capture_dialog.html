<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Share Screen or Window</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-family);
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .dialog-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-3);
      width: 100%;
      max-width: 580px;
      max-height: 100%;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .title {
      font-size: 16.5px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .sources-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-height: 290px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .source-card {
      border: 2px solid var(--card-border);
      border-radius: 12px;
      background: var(--setting-card-bg);
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: start;
      color: var(--text-primary);
      font-family: inherit;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .source-card:hover {
      background: var(--hover-bg);
    }
    .source-card.selected {
      border-color: var(--md-primary);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }
    .thumb-wrap {
      width: 100%;
      height: 112px;
      border-radius: 8px;
      background: var(--preview-bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .source-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .source-name {
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-fallback {
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: var(--preview-bg);
      padding: 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .preview-fallback img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .brand img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }
    .btn {
      border: none;
      border-radius: var(--radius-full);
      padding: 9px 22px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-cancel:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }
    .btn-allow {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-allow:hover:not(:disabled) {
      background: var(--md-primary-hover);
    }
    .btn-allow:disabled {
      opacity: 0.45;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="dialog-card">
    <div class="title" id="dc-title">Choose what to share with Gemini</div>
    <div class="desc" id="dc-desc">Select a screen or window. Gemini will only see the selected surface while sharing is active.</div>
    <div class="sources-grid" id="sources-grid"></div>
    <div class="preview-fallback" id="preview-fallback">
      <img id="fallback-preview-img" alt="">
      <span>Click Share to select your screen or window via the system portal.</span>
    </div>
    <div class="brand">
      <img src="../assets/icon.png" alt="">
      <span>Google Gemini</span>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-cancel" id="dc-cancel">Cancel</button>
      <button type="button" class="btn btn-allow" id="dc-allow">Share</button>
    </div>
  </div>
  <script src="display_capture_dialog.js"></script>
</body>
</html>
