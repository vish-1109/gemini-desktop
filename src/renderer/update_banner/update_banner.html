<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Update Available</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: var(--font-family);
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-inline: 16px;
    }
    .pill-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-full);
      padding: 6px 10px 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-2);
      max-width: 100%;
    }
    .pill-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .pill-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-action {
      background: var(--md-primary);
      color: var(--md-on-primary);
      border: none;
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-action:hover {
      background: var(--md-primary-hover);
    }
    .btn-dismiss {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .btn-dismiss:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="pill-card">
    <img class="pill-icon" src="../assets/icon.png" alt="">
    <span class="pill-text" id="pill-text">Update available</span>
    <button type="button" class="btn-action" id="btn-open-release">View Release</button>
    <button type="button" class="btn-dismiss" id="btn-dismiss" title="Dismiss" aria-label="Dismiss">✕</button>
  </div>
  <script src="update_banner.js"></script>
</body>
</html>
